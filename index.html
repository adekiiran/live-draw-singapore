<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LANAYA88</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial, sans-serif;
  background:#001f2f;
  color:#fff;
}

/* HEADER */
.header{
  background:#cfd8dc;
  color:#000;
  text-align:center;
  padding:15px;
}

.header h1{
  margin:0;
  font-size:30px;
}

.sub{
  font-size:14px;
  letter-spacing:2px;
}

/* RUNNING TEXT */
.running{
  background:#ffcc80;
  color:#000;
  padding:8px;
  overflow:hidden;
  white-space:nowrap;
}

.running span{
  display:inline-block;
  animation:jalan 10s linear infinite;
}

@keyframes jalan{
  0%{transform:translateX(100%)}
  100%{transform:translateX(-100%)}
}

/* LAYOUT */
.container{
  display:flex;
}

/* KIRI */
.left{
  flex:2;
  height:500px;
  overflow:hidden;
  border:2px solid #0ff;
}

.scroll{
  animation:scrollUp 20s linear infinite;
}

@keyframes scrollUp{
  0%{transform:translateY(0);}
  100%{transform:translateY(-50%);}
}

/* GRID */
.hasil-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:5px;
  padding:10px;
}

.hasil-grid a{
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:#002b3f;
  color:#00eaff;
  padding:10px;
  text-decoration:none;
  border:1px solid #0ff;
  box-shadow:0 0 5px #0ff;
}

/* TEXT */
.nama{ text-align:left; }
.angka{ text-align:right; color:#00ff99; }

/* IKLAN */
.right{
  flex:1;
  padding:10px;
}

.ads img{
  width:100%;
  margin-bottom:10px;
  border-radius:8px;
}

/* FLOATING */
.floating-chat{
  position:fixed;
  bottom:20px;
  right:20px;
}

.floating-chat a{
  display:flex;
  align-items:center;
  gap:8px;
  background:#002b3f;
  padding:8px 12px;
  border-radius:50px;
  color:#fff;
  text-decoration:none;
}
</style>
</head>

<body>

<!-- HEADER -->
<div class="header">
  <h1>LANAYA88</h1>
  <div class="sub">SITUS RESMI PASARAN TOGEL</div>
</div>

<!-- BANNER -->
<div class="ads">
  <img src="https://via.placeholder.com/600x80">
</div>

<!-- RUNNING -->
<div class="running">
  <span>PASARAN RESULT UPDATE SETIAP HARI</span>
</div>

<!-- CONTENT -->
<div class="container">

  <!-- DATA -->
  <div class="left">
    <div class="scroll">
      <div class="hasil-grid">

        <a href="#"><span class="nama">HONGKONG</span><span class="angka">2882</span></a>
        <a href="#"><span class="nama">PCSO</span><span class="angka">0012</span></a>
        <a href="#"><span class="nama">MACAU</span><span class="angka">8755</span></a>
        <a href="#"><span class="nama">BANGKOK</span><span class="angka">7661</span></a>

      </div>
    </div>
  </div>

  <!-- IKLAN -->
  <div class="right">
    <div class="ads">
      <img src="https://via.placeholder.com/300x120">
    </div>
  </div>

</div>

<!-- FLOATING -->
<div class="floating-chat">
  <a href="https://wa.me/6281234567890">
    <img src="https://cdn-icons-png.flaticon.com/512/733/733585.png" width="25">
    WhatsApp
  </a>
</div>

</body>
</html>
