<!doctype html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LANAYA88</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0d0631;
  color:#fff;
}

/* HEADER */
.top{
  width:min(1100px,95%);
  margin:40px auto 20px;
  background:#d8dce0;
  color:#000;
  text-align:center;
  padding:20px;
  border-radius:10px;
}

.clock{
  font-size:30px;
  font-family:monospace;
  color:#00ffff;
}

.date{
  font-size:14px;
}

/* SCROLL */
.scroll-box{
  height:400px;
  overflow-y:auto;
}

.cell{
  border:1px solid #1010de;
  padding:10px;
  text-align:center;
}

.num{
  background:#1010de;
  padding:4px 10px;
  border-radius:8px;
}
</style>
</head>

<body>

<div class="top">
  <div class="site-title">JUDUL BESAR</div>
  <div id="clock"></div>
  <div id="date"></div>
</div>

<div class="scroll-box">
  <div id="dataList"></div>
</div>

<script>

// DATA
const list = [
  {nama:"FLORIDA", angka:"1836"},
  {nama:"INDIANA", angka:"7122"},
  {nama:"TEXAS", angka:"8685"}
];

// DUPLIKAT
const doubleList = [...list, ...list];

// RENDER
function render(){
  let html = "";
  doubleList.forEach(item=>{
    html += `<div class="cell">
      ${item.nama} <span class="num">${item.angka}</span>
    </div>`;
  });
  document.getElementById("dataList").innerHTML = html;
}
render();

// SCROLL
let scrollPos = 0;
setInterval(()=>{
  const box = document.querySelector('.scroll-box');
  scrollPos++;
  if(scrollPos >= box.scrollHeight/2){
    scrollPos = 0;
  }
  box.scrollTop = scrollPos;
},30);

// JAM
function updateClock(){
  const now = new Date();

  let h = String(now.getHours()).padStart(2,'0');
  let m = String(now.getMinutes()).padStart(2,'0');
  let s = String(now.getSeconds()).padStart(2,'0');

  document.getElementById("clock").textContent = `${h}:${m}:${s}`;

  document.getElementById("date").textContent =
    now.toLocaleDateString("id-ID",{
      weekday:"long",
      day:"numeric",
      month:"long",
      year:"numeric"
    });
}

setInterval(updateClock,1000);
updateClock();

</script>

</body>
</html>
